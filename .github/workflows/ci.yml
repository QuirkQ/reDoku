name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two cheap gates run before `make build`, which builds a Docker
      # image and cross-compiles mruby — minutes, and by far the slowest thing
      # in this workflow. Both of these need nothing but the checkout and the
      # runner's stock tools, and both fail in seconds. Putting them first
      # means a lint regression or a broken installer is reported on its own
      # terms instead of arriving after (or behind) a toolchain failure that
      # has nothing to do with it.

      # Decision D9: shellcheck over every shell file in the repo.
      #
      # shellcheck is preinstalled on ubuntu-latest (0.9.0 on the 24.04 image
      # as of this writing) — no action, no apt install. --version is printed
      # because findings differ between releases: 0.9 raises an SC2015 that
      # 0.11 does not. The tree is verified clean under 0.9.0, 0.10.0 and
      # 0.11.0, so a runner-image bump cannot break this gate in either
      # direction, and the log says which version judged the code.
      #
      # No -s override: every one of these files declares #!/bin/sh, and the
      # shebang is what actually runs them, so forcing a dialect could only let
      # the lint drift from the real interpreter. No -x: nothing here sources
      # anything. Default severity (style and up) — a gate that ignores the
      # cheap findings is a gate you stop reading. shellcheck's own exit status
      # is what fails the build; there is no `|| true` here on purpose.
      - name: Shellcheck
        run: |
          shellcheck --version
          # Written out rather than globbed: bin/redoku carries no .sh suffix,
          # so *.sh would leave the largest script in the repo unlinted.
          shellcheck bin/redoku device/install.sh device/uninstall.sh \
            tools/install.sh tools/mkkit.sh tools/test/kit_test.sh
          # A written-out list goes stale silently, which is the one failure
          # mode a lint gate cannot afford. Re-derive the set and refuse to
          # pass if it disagrees with what was just linted. Adding a script
          # then becomes a review decision, never an unnoticed hole.
          #
          # The set is the UNION of two scans, because neither alone is D9's
          # "every shell file":
          #   * a shebang scan is the only thing that finds bin/redoku, which
          #     has no suffix — but it misses a sourced fragment, which is
          #     shell and has no shebang at all;
          #   * a *.sh/*.bash pathspec finds that fragment — but not a
          #     suffixless script.
          # A file caught by only one scan is still in the union, which is the
          # whole point.
          #
          # core.quotePath=false and -z: git otherwise renders a non-ASCII path
          # as an escaped, double-quoted string, and `head` on that literal name
          # then fails silently and the file drops out of the scan unnoticed —
          # a hole in exactly the shape this guard exists to prevent. A path
          # containing a literal newline survives both scans intact and then
          # cannot match $expected, so it fails the guard loudly rather than
          # slipping through: the safe direction.
          found=$(
            {
              git -c core.quotePath=false ls-files -z |
                while IFS= read -r -d '' f; do
                  case $(head -n 1 -- "$f" 2>/dev/null) in
                    '#!'*sh | '#!'*sh[!A-Za-z0-9]*) printf '%s\n' "$f" ;;
                  esac
                done
              git -c core.quotePath=false ls-files -z -- '*.sh' '*.bash' |
                tr '\0' '\n'
            } | LC_ALL=C sort -u
          )
          # Keep this list LC_ALL=C-sorted — that is the order $found comes
          # back in. These continuation lines sit at the block scalar's own
          # indent, so YAML strips it and the shell sees them flush left — do
          # not "tidy" them. If either ever breaks, this guard fails loudly
          # rather than quietly passing, which is the right way round.
          expected='bin/redoku
          device/install.sh
          device/uninstall.sh
          tools/install.sh
          tools/mkkit.sh
          tools/test/kit_test.sh'
          if [ "$found" != "$expected" ]; then
            printf 'shellcheck scope drift.\n\nthis step lints:\n%s\n\nthe repo contains:\n%s\n\nAdd the new file to the list above, or say in the commit why it is excluded.\n' \
              "$expected" "$found" >&2
            exit 1
          fi

      # Needs no Docker, no mruby and no cross-toolchain: kit_test.sh builds
      # its fixture kits from synthetic files via mkkit.sh's --build-dir, and
      # the Makefile runs it on the host on purpose (tools/install.sh's whole
      # risk surface IS the host's curl, shasum and tar).
      # KIT_SHELLS is set explicitly, and the third entry is the point. On
      # ubuntu-latest /bin/sh IS dash, so the suite's own default of "sh dash"
      # runs dash twice and gives CI no bash coverage at all — bash 3.2 exists
      # only on a developer's macOS, which CI does not run. Naming all three
      # takes the run from 136 assertions to 204.
      - name: Test kit
        run: make test-kit
        env:
          KIT_SHELLS: sh dash bash

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test tools
        run: make test-tools

      - name: Upload rm2 binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rm2-binaries
          path: build/rm2/bin/
          retention-days: 30
